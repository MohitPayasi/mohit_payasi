[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "langgraph-project"
version = "0.1.0"
description = "A LangGraph-based AI agent project using multi-step graph workflows"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Mohit Payasi", email = "mohit@example.com" }
]
keywords = ["langgraph", "langchain", "llm", "agent", "graph", "ai"]

dependencies = [
    "langgraph>=0.2.0",
    "langgraph-checkpoint>=1.0.0",
    "langchain>=0.3.0",
    "langchain-core>=0.3.0",
    "langchain-community>=0.3.0",
    "langchain-openai>=0.2.0",
    "langchain-groq>=0.2.0",
    "langchain-anthropic>=0.2.0",
    "langchain-google-genai>=2.0.0",
    "langsmith>=0.1.0",
    "openai>=1.0.0",
    "anthropic>=0.30.0",
    "google-generativeai>=0.8.0",
    "groq>=0.11.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "tavily-python>=0.3.0",
    "typing-extensions>=4.8.0",
]

[project.optional-dependencies]
dev = [
    "jupyter",
    "ipykernel",
    "notebook",
    "black",
    "isort",
    "flake8",
    "pytest",
    "pytest-asyncio",
]
vector = [
    "faiss-cpu",
    "chromadb",
    "sentence-transformers",
]
data = [
    "numpy",
    "pandas",
]
all = [
    "langgraph-project[dev,vector,data]",
]

[project.urls]
Homepage = "https://github.com/mohit-payasi/langgraph-project"
Repository = "https://github.com/mohit-payasi/langgraph-project"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.black]
line-length = 88
target-version = ["py310", "py311", "py312"]

[tool.isort]
profile = "black"
line_length = 88

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
